<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Enhancer</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <div class="fx fx-reverb"></div>
        <div class="fx fx-bass"></div>
        <div class="fx fx-bass-bar" id="bass-bar"></div>

        <h1>Audio Enhancer</h1>
        <canvas id="viz" width="560" height="120"></canvas>

        <div class="control-group">
            <label for="speed-slider">Speed</label>
            <div class="slider-container">
                <input type="range" id="speed-slider" min="0.5" max="1.5" step="0.05" value="1">
                <span id="speed-value">1.00x</span>
            </div>
        </div>

        <div class="control-group">
            <label for="reverb-slider">Reverb</label>
            <div class="slider-container">
                <input type="range" id="reverb-slider" min="0" max="100" step="5" value="0">
                <span id="reverb-value">0%</span>
            </div>
        </div>

        <div class="control-group">
            <label for="bass-slider">Bass Boost</label>
            <div class="slider-container">
                <input type="range" id="bass-slider" min="0" max="100" step="5" value="0">
                <span id="bass-value">0%</span>
            </div>
        </div>

        <button id="reset-btn">Reset All</button>
        <div class="credit">Made by <a href="https://t.me/farmac0l0r" target="_blank">farmac0l0r</a> &middot; <a href="privacy.html" target="_blank">Privacy</a></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
